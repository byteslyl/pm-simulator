<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareerCraft - 项目决策模拟器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0A0E14;
  --surface: #131820;
  --card: #1A2028;
  --card-hover: #202832;
  --border: #2A3441;
  --border-light: #3A4453;
  --text: #D4D9E1;
  --text-bright: #F0F2F5;
  --muted: #7A8290;
  --dim: #5A6270;
  --amber: #F5A623;
  --amber-soft: rgba(245,166,35,0.12);
  --amber-border: rgba(245,166,35,0.3);
  --teal: #14B8A6;
  --teal-soft: rgba(20,184,166,0.12);
  --teal-border: rgba(20,184,166,0.3);
  --coral: #EF4444;
  --coral-soft: rgba(239,68,68,0.12);
  --coral-border: rgba(239,68,68,0.3);
  --warning: #FBBF24;
  --warning-soft: rgba(251,191,36,0.12);
  --radius: 8px;
  --radius-lg: 12px;
  --font-serif: 'Fraunces', Georgia, serif;
  --font-sans: 'Plus Jakarta Sans', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:var(--font-sans); font-size:14px; line-height:1.6; overflow:hidden; height:100vh; }
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border-light); border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:var(--muted); }

/* Layout */
.app { display:flex; height:100vh; }
.sidebar { width:260px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; }
.main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.content-area { flex:1; overflow-y:auto; padding:32px 40px; }
.info-panel { width:320px; flex-shrink:0; border-left:1px solid var(--border); background:var(--surface); display:flex; flex-direction:column; overflow:hidden; }

/* Sidebar */
.sidebar-header { padding:24px 20px; border-bottom:1px solid var(--border); }
.sidebar-header h1 { font-family:var(--font-serif); font-size:22px; font-weight:600; color:var(--text-bright); letter-spacing:-0.5px; }
.sidebar-header p { font-family:var(--font-mono); font-size:11px; color:var(--amber); margin-top:4px; letter-spacing:1px; text-transform:uppercase; }
.step-list { flex:1; padding:16px 0; overflow-y:auto; }
.step-item { display:flex; align-items:center; gap:12px; padding:10px 20px; cursor:pointer; transition:all 0.2s; position:relative; }
.step-item:hover { background:var(--card); }
.step-item.active { background:var(--amber-soft); }
.step-item.active::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--amber); }
.step-num { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:12px; font-weight:600; border:1.5px solid var(--border-light); color:var(--muted); flex-shrink:0; transition:all 0.3s; }
.step-item.active .step-num { border-color:var(--amber); color:var(--amber); background:var(--amber-soft); }
.step-item.done .step-num { border-color:var(--teal); color:var(--bg); background:var(--teal); }
.step-item.done .step-num::after { content:'✓'; font-size:14px; }
.step-item.done .step-num span { display:none; }
.step-info { flex:1; min-width:0; }
.step-label { font-size:13px; font-weight:500; color:var(--text); }
.step-item.active .step-label { color:var(--amber); }
.step-item.done .step-label { color:var(--muted); }
.step-desc { font-size:11px; color:var(--dim); margin-top:2px; }
.sidebar-footer { padding:16px 20px; border-top:1px solid var(--border); }
.timer-display { display:flex; align-items:center; gap:8px; }
.timer-icon { width:8px; height:8px; border-radius:50%; background:var(--amber); animation:pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
.timer-label { font-family:var(--font-mono); font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
.timer-value { font-family:var(--font-mono); font-size:20px; font-weight:600; color:var(--text-bright); }
.timer-bar { height:3px; background:var(--border); border-radius:2px; margin-top:8px; overflow:hidden; }
.timer-bar-fill { height:100%; background:var(--amber); border-radius:2px; transition:width 0.5s ease; }

/* Main Header */
.main-header { padding:16px 40px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; background:var(--surface); }
.breadcrumb { display:flex; align-items:center; gap:8px; }
.breadcrumb-phase { font-family:var(--font-mono); font-size:11px; color:var(--amber); text-transform:uppercase; letter-spacing:1.5px; }
.breadcrumb-title { font-family:var(--font-serif); font-size:18px; font-weight:500; color:var(--text-bright); }
.header-actions { display:flex; gap:12px; }
.btn { padding:8px 20px; border-radius:var(--radius); font-family:var(--font-sans); font-size:13px; font-weight:600; cursor:pointer; border:none; transition:all 0.2s; }
.btn-primary { background:var(--amber); color:var(--bg); }
.btn-primary:hover { background:#FFB938; transform:translateY(-1px); box-shadow:0 4px 12px rgba(245,166,35,0.3); }
.btn-primary:disabled { opacity:0.4; cursor:not-allowed; transform:none; box-shadow:none; }
.btn-secondary { background:transparent; color:var(--text); border:1px solid var(--border-light); }
.btn-secondary:hover { background:var(--card); border-color:var(--muted); }
.btn-ghost { background:transparent; color:var(--muted); padding:6px 12px; font-size:12px; }
.btn-ghost:hover { color:var(--text); }

/* Content sections */
.section { display:none; animation:fadeIn 0.4s ease; }
.section.active { display:block; }
@keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

/* Briefing */
.briefing-hero { margin-bottom:32px; }
.briefing-tag { display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:20px; background:var(--coral-soft); border:1px solid var(--coral-border); font-family:var(--font-mono); font-size:11px; color:var(--coral); text-transform:uppercase; letter-spacing:1px; margin-bottom:16px; }
.briefing-tag::before { content:''; width:6px; height:6px; border-radius:50%; background:var(--coral); animation:pulse 1.5s ease-in-out infinite; }
.briefing-title { font-family:var(--font-serif); font-size:36px; font-weight:600; color:var(--text-bright); line-height:1.2; margin-bottom:12px; letter-spacing:-0.5px; }
.briefing-subtitle { font-size:16px; color:var(--muted); max-width:600px; }
.briefing-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:28px; margin-bottom:24px; }
.briefing-card h3 { font-family:var(--font-mono); font-size:11px; color:var(--amber); text-transform:uppercase; letter-spacing:1.5px; margin-bottom:16px; }
.briefing-text { font-size:15px; line-height:1.8; color:var(--text); }
.briefing-text strong { color:var(--text-bright); font-weight:600; }
.briefing-meta { display:flex; gap:24px; margin-top:20px; padding-top:20px; border-top:1px solid var(--border); }
.meta-item { display:flex; flex-direction:column; gap:4px; }
.meta-label { font-family:var(--font-mono); font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; }
.meta-value { font-family:var(--font-mono); font-size:14px; color:var(--text-bright); font-weight:600; }
.briefing-options { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:24px; }
.option-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:20px; transition:all 0.2s; }
.option-card:hover { border-color:var(--border-light); transform:translateY(-2px); }
.option-code { font-family:var(--font-mono); font-size:12px; color:var(--amber); font-weight:600; margin-bottom:8px; }
.option-name { font-family:var(--font-serif); font-size:18px; font-weight:500; color:var(--text-bright); margin-bottom:8px; }
.option-desc { font-size:13px; color:var(--muted); line-height:1.5; }

/* Role cards */
.roles-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:20px; margin-top:24px; }
.role-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:24px; cursor:pointer; transition:all 0.3s; position:relative; overflow:hidden; }
.role-card:hover { border-color:var(--border-light); transform:translateY(-3px); box-shadow:0 8px 24px rgba(0,0,0,0.3); }
.role-card.interviewed { border-color:var(--teal-border); }
.role-card.interviewed::after { content:'已访谈'; position:absolute; top:12px; right:12px; font-family:var(--font-mono); font-size:10px; color:var(--teal); padding:2px 8px; border-radius:10px; background:var(--teal-soft); border:1px solid var(--teal-border); }
.role-avatar { width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--font-serif); font-size:20px; font-weight:600; margin-bottom:16px; }
.role-name { font-family:var(--font-serif); font-size:20px; font-weight:500; color:var(--text-bright); margin-bottom:4px; }
.role-title { font-size:13px; color:var(--muted); margin-bottom:12px; }
.role-desc { font-size:13px; color:var(--text); line-height:1.6; }
.role-interest { display:flex; align-items:center; gap:6px; margin-top:12px; padding-top:12px; border-top:1px solid var(--border); font-size:12px; color:var(--dim); }
.role-interest strong { color:var(--amber); }

/* Chat */
.chat-container { display:flex; flex-direction:column; height:calc(100vh - 200px); }
.chat-header { display:flex; align-items:center; gap:16px; padding-bottom:16px; border-bottom:1px solid var(--border); margin-bottom:16px; }
.chat-back { cursor:pointer; color:var(--muted); font-size:13px; display:flex; align-items:center; gap:6px; }
.chat-back:hover { color:var(--text); }
.chat-role-info { display:flex; align-items:center; gap:12px; }
.chat-messages { flex:1; overflow-y:auto; padding:8px 0; display:flex; flex-direction:column; gap:12px; }
.msg { max-width:75%; padding:12px 16px; border-radius:var(--radius-lg); font-size:14px; line-height:1.6; animation:msgIn 0.3s ease; }
@keyframes msgIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
.msg.role { background:var(--card); border:1px solid var(--border); border-top-left-radius:4px; align-self:flex-start; }
.msg.student { background:var(--amber-soft); border:1px solid var(--amber-border); border-top-right-radius:4px; align-self:flex-end; color:var(--text-bright); }
.msg.system { background:transparent; border:1px dashed var(--border-light); color:var(--muted); font-size:12px; align-self:center; text-align:center; max-width:90%; }
.msg.fact-discovered { background:var(--teal-soft); border:1px solid var(--teal-border); border-top-left-radius:4px; align-self:flex-start; }
.msg.fact-discovered::before { content:'📋 发现关键信息'; display:block; font-family:var(--font-mono); font-size:10px; color:var(--teal); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
.suggested-questions { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
.question-chip { padding:6px 14px; border-radius:20px; background:var(--card); border:1px solid var(--border); font-size:12px; color:var(--text); cursor:pointer; transition:all 0.2s; }
.question-chip:hover { border-color:var(--amber); color:var(--amber); background:var(--amber-soft); }
.question-chip.asked { opacity:0.4; cursor:default; }
.question-chip.asked:hover { border-color:var(--border); color:var(--text); background:var(--card); }
.chat-input-area { display:flex; gap:12px; padding-top:16px; border-top:1px solid var(--border); }
.chat-input { flex:1; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:10px 16px; color:var(--text); font-family:var(--font-sans); font-size:14px; outline:none; transition:border-color 0.2s; }
.chat-input:focus { border-color:var(--amber); }
.chat-input::placeholder { color:var(--dim); }
.typing-indicator { display:flex; gap:4px; padding:12px 16px; }
.typing-indicator span { width:6px; height:6px; border-radius:50%; background:var(--muted); animation:typing 1.4s ease-in-out infinite; }
.typing-indicator span:nth-child(2) { animation-delay:0.2s; }
.typing-indicator span:nth-child(3) { animation-delay:0.4s; }
@keyframes typing { 0%,60%,100% { transform:translateY(0); opacity:0.4; } 30% { transform:translateY(-6px); opacity:1; } }

/* Info Panel */
.info-panel-header { padding:20px; border-bottom:1px solid var(--border); }
.info-panel-header h3 { font-family:var(--font-mono); font-size:11px; color:var(--amber); text-transform:uppercase; letter-spacing:1.5px; margin-bottom:4px; }
.info-panel-header p { font-size:12px; color:var(--muted); }
.info-stats { display:flex; gap:16px; margin-top:12px; }
.info-stat { flex:1; }
.info-stat-label { font-family:var(--font-mono); font-size:10px; color:var(--dim); text-transform:uppercase; }
.info-stat-value { font-family:var(--font-mono); font-size:20px; font-weight:600; color:var(--text-bright); }
.fact-list { flex:1; overflow-y:auto; padding:16px 20px; }
.fact-list-empty { text-align:center; color:var(--dim); font-size:13px; padding:40px 20px; }
.fact-item { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; margin-bottom:8px; animation:factIn 0.3s ease; }
@keyframes factIn { from { opacity:0; transform:translateX(8px); } to { opacity:1; transform:translateX(0); } }
.fact-item.hidden-fact { border-color:var(--amber-border); background:var(--amber-soft); }
.fact-source { font-family:var(--font-mono); font-size:10px; color:var(--amber); text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }
.fact-content { font-size:13px; color:var(--text); line-height:1.5; }
.fact-tag { display:inline-block; font-family:var(--font-mono); font-size:9px; padding:1px 6px; border-radius:8px; margin-top:4px; text-transform:uppercase; letter-spacing:0.5px; }
.fact-tag.critical { background:var(--coral-soft); color:var(--coral); border:1px solid var(--coral-border); }
.fact-tag.high { background:var(--warning-soft); color:var(--warning); border:1px solid rgba(251,191,36,0.3); }
.fact-tag.medium { background:var(--teal-soft); color:var(--teal); border:1px solid var(--teal-border); }
.fact-tag.hidden { background:var(--amber-soft); color:var(--amber); border:1px solid var(--amber-border); }

/* Decision Form */
.decision-section { max-width:800px; }
.decision-block { background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:24px; margin-bottom:20px; }
.decision-block h3 { font-family:var(--font-mono); font-size:11px; color:var(--amber); text-transform:uppercase; letter-spacing:1.5px; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
.decision-block h3 .count { background:var(--amber-soft); color:var(--amber); padding:1px 8px; border-radius:10px; font-size:10px; }
.option-choices { display:flex; flex-direction:column; gap:12px; }
.option-choice { display:flex; gap:16px; padding:16px; border:1px solid var(--border); border-radius:var(--radius); cursor:pointer; transition:all 0.2s; }
.option-choice:hover { border-color:var(--border-light); background:var(--card-hover); }
.option-choice.selected { border-color:var(--amber); background:var(--amber-soft); }
.option-radio { width:20px; height:20px; border-radius:50%; border:2px solid var(--border-light); flex-shrink:0; margin-top:2px; transition:all 0.2s; position:relative; }
.option-choice.selected .option-radio { border-color:var(--amber); }
.option-choice.selected .option-radio::after { content:''; position:absolute; top:3px; left:3px; width:10px; height:10px; border-radius:50%; background:var(--amber); }
.option-text { flex:1; }
.option-code-line { font-family:var(--font-mono); font-size:12px; color:var(--amber); font-weight:600; margin-bottom:4px; }
.option-name-line { font-family:var(--font-serif); font-size:16px; font-weight:500; color:var(--text-bright); margin-bottom:4px; }
.option-detail { font-size:13px; color:var(--muted); }
.fact-checklist { display:flex; flex-direction:column; gap:8px; }
.fact-check { display:flex; align-items:flex-start; gap:10px; padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius); cursor:pointer; transition:all 0.2s; }
.fact-check:hover { border-color:var(--border-light); }
.fact-check.checked { border-color:var(--teal-border); background:var(--teal-soft); }
.fact-checkbox { width:18px; height:18px; border-radius:4px; border:1.5px solid var(--border-light); flex-shrink:0; margin-top:1px; transition:all 0.2s; position:relative; }
.fact-check.checked .fact-checkbox { border-color:var(--teal); background:var(--teal); }
.fact-check.checked .fact-checkbox::after { content:'✓'; position:absolute; top:-1px; left:2px; color:var(--bg); font-size:13px; font-weight:700; }
.fact-check-label { font-size:13px; color:var(--text); flex:1; }
.fact-check.checked .fact-check-label { color:var(--text-bright); }
.textarea-field { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius); padding:12px; color:var(--text); font-family:var(--font-sans); font-size:14px; line-height:1.6; outline:none; resize:vertical; min-height:80px; transition:border-color 0.2s; }
.textarea-field:focus { border-color:var(--amber); }
.textarea-field::placeholder { color:var(--dim); }
.constraint-result { padding:12px 16px; border-radius:var(--radius); margin-top:8px; display:flex; align-items:center; gap:8px; font-size:13px; }
.constraint-result.pass { background:var(--teal-soft); border:1px solid var(--teal-border); color:var(--teal); }
.constraint-result.fail { background:var(--coral-soft); border:1px solid var(--coral-border); color:var(--coral); }
.constraint-result.pending { background:var(--card); border:1px solid var(--border); color:var(--muted); }

/* Consequences */
.consequence-hero { text-align:center; margin-bottom:40px; }
.consequence-verdict { font-family:var(--font-mono); font-size:12px; text-transform:uppercase; letter-spacing:2px; margin-bottom:12px; }
.consequence-verdict.success { color:var(--teal); }
.consequence-verdict.warning { color:var(--warning); }
.consequence-verdict.danger { color:var(--coral); }
.consequence-title { font-family:var(--font-serif); font-size:32px; font-weight:600; color:var(--text-bright); margin-bottom:8px; }
.consequence-desc { font-size:15px; color:var(--muted); max-width:600px; margin:0 auto; }
.state-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-bottom:32px; }
.state-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:24px; }
.state-card-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.state-name { font-family:var(--font-mono); font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
.state-change { font-family:var(--font-mono); font-size:12px; padding:2px 8px; border-radius:10px; }
.state-change.up { color:var(--teal); background:var(--teal-soft); }
.state-change.down { color:var(--coral); background:var(--coral-soft); }
.state-change.flat { color:var(--muted); background:var(--card); }
.state-bar { height:8px; background:var(--border); border-radius:4px; overflow:hidden; margin-bottom:8px; }
.state-bar-fill { height:100%; border-radius:4px; transition:width 1s ease; }
.state-bar-fill.teal { background:var(--teal); }
.state-bar-fill.amber { background:var(--amber); }
.state-bar-fill.coral { background:var(--coral); }
.state-value { font-family:var(--font-mono); font-size:24px; font-weight:600; color:var(--text-bright); }
.state-detail { font-size:12px; color:var(--muted); margin-top:8px; }
.event-list { background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:24px; margin-bottom:24px; }
.event-list h3 { font-family:var(--font-mono); font-size:11px; color:var(--amber); text-transform:uppercase; letter-spacing:1.5px; margin-bottom:16px; }
.event-item { display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); }
.event-item:last-child { border-bottom:none; }
.event-icon { width:8px; height:8px; border-radius:50%; flex-shrink:0; margin-top:7px; }
.event-icon.danger { background:var(--coral); }
.event-icon.warning { background:var(--warning); }
.event-icon.success { background:var(--teal); }
.event-text { font-size:14px; color:var(--text); line-height:1.6; }
.event-text strong { color:var(--text-bright); }

/* Review */
.review-hero { margin-bottom:32px; }
.review-score { display:flex; align-items:baseline; gap:8px; margin-bottom:8px; }
.score-value { font-family:var(--font-serif); font-size:48px; font-weight:600; color:var(--text-bright); }
.score-max { font-family:var(--font-mono); font-size:20px; color:var(--muted); }
.review-grade { font-family:var(--font-mono); font-size:12px; text-transform:uppercase; letter-spacing:1.5px; }
.review-section { background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:24px; margin-bottom:20px; }
.review-section h3 { font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:1.5px; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
.review-section h3.good { color:var(--teal); }
.review-section h3.bad { color:var(--coral); }
.review-section h3.neutral { color:var(--amber); }
.review-stat-row { display:flex; gap:24px; margin-bottom:16px; }
.review-stat { flex:1; text-align:center; padding:16px; border:1px solid var(--border); border-radius:var(--radius); }
.review-stat-value { font-family:var(--font-mono); font-size:28px; font-weight:600; color:var(--text-bright); }
.review-stat-label { font-size:12px; color:var(--muted); margin-top:4px; }
.review-list-item { display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--border); font-size:14px; }
.review-list-item:last-child { border-bottom:none; }
.review-list-icon { flex-shrink:0; width:20px; text-align:center; }
.review-list-icon.good { color:var(--teal); }
.review-list-icon.bad { color:var(--coral); }
.review-list-text { color:var(--text); }
.review-list-text strong { color:var(--text-bright); }
.review-list-detail { font-size:12px; color:var(--muted); margin-top:2px; }
.suggestion-card { background:var(--amber-soft); border:1px solid var(--amber-border); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
.suggestion-card strong { color:var(--amber); font-size:13px; }
.suggestion-card p { font-size:13px; color:var(--text); margin-top:4px; }
.counterfactual { background:var(--card); border:1px dashed var(--border-light); border-radius:var(--radius-lg); padding:24px; }
.counterfactual h3 { font-family:var(--font-mono); font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1.5px; margin-bottom:16px; }
.cf-item { padding:12px 0; border-bottom:1px solid var(--border); }
.cf-item:last-child { border-bottom:none; }
.cf-option { font-family:var(--font-mono); font-size:12px; color:var(--amber); margin-bottom:4px; }
.cf-result { font-size:14px; color:var(--text); }
.cf-result strong { color:var(--text-bright); }
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>CareerCraft</h1>
      <p>项目决策模拟器</p>
    </div>
    <div class="step-list" id="stepList"></div>
    <div class="sidebar-footer">
      <div class="timer-display">
        <div class="timer-icon"></div>
        <div>
          <div class="timer-label">剩余时间</div>
          <div class="timer-value" id="timerValue">40:00</div>
        </div>
      </div>
      <div class="timer-bar"><div class="timer-bar-fill" id="timerBar" style="width:100%"></div></div>
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="main-header">
      <div class="breadcrumb">
        <span class="breadcrumb-phase" id="phaseLabel">阶段 1</span>
        <span class="breadcrumb-title" id="phaseTitle">接收任务</span>
      </div>
      <div class="header-actions">
        <button class="btn btn-ghost" id="prevBtn" style="display:none" onclick="prevStep()">上一步</button>
        <button class="btn btn-primary" id="nextBtn" onclick="nextStep()">开始任务</button>
      </div>
    </div>
    <div class="content-area" id="contentArea"></div>
  </div>

  <!-- Info Panel -->
  <div class="info-panel" id="infoPanel" style="display:none">
    <div class="info-panel-header">
      <h3>信息板</h3>
      <p>已获取的关键信息将显示在这里</p>
      <div class="info-stats">
        <div class="info-stat">
          <div class="info-stat-label">已发现</div>
          <div class="info-stat-value" id="factCount">0</div>
        </div>
        <div class="info-stat">
          <div class="info-stat-label">已访谈</div>
          <div class="info-stat-value" id="roleCount">0</div>
        </div>
      </div>
    </div>
    <div class="fact-list" id="factList">
      <div class="fact-list-empty">开始访谈后<br>关键信息将出现在这里</div>
    </div>
  </div>
</div>

<script>
// ===== DATA =====
const roles = [
  { id:'tech', name:'张明', title:'技术负责人', initial:'张', color:'#F5A623', desc:'负责核心系统开发和技术架构，掌握接口风险和技术债务的详细信息。', interest:'关注技术风险和系统稳定性' },
  { id:'qa', name:'李薇', title:'QA负责人', initial:'李', color:'#14B8A6', desc:'负责质量保障和测试，了解缺陷详情和测试覆盖情况。', interest:'关注产品质量和上线风险' },
  { id:'ops', name:'王浩', title:'运营负责人', initial:'王', color:'#8B5CF6', desc:'负责市场推广和用户运营，掌握商业损失和用户反馈数据。', interest:'关注按时上线和用户满意' },
  { id:'ceo', name:'陈总', title:'CEO', initial:'陈', color:'#EF4444', desc:'公司最高决策者，掌握市场战略和竞争态势的全局信息。', interest:'关注整体商业目标和风险平衡' },
];

const facts = [
  { id:'failure_rate', content:'核心支付接口故障率约15%', holder:'tech', hidden:false, value:'high' },
  { id:'available_dev', content:'可用研发资源3人天', holder:'tech', hidden:false, value:'high' },
  { id:'gray_feasible', content:'灰度发布10%用户技术上可行', holder:'tech', hidden:false, value:'medium' },
  { id:'fix_time', content:'修复核心缺陷需要3人天', holder:'tech', hidden:true, value:'high' },
  { id:'payment_chain', content:'故障接口直接影响支付链路', holder:'tech', hidden:true, value:'critical' },
  { id:'rollback_time', content:'系统回滚需要约4小时', holder:'tech', hidden:true, value:'critical' },
  { id:'bug_reproducible', content:'缺陷可稳定复现', holder:'qa', hidden:false, value:'medium' },
  { id:'bug_severity', content:'缺陷严重程度为P1', holder:'qa', hidden:false, value:'high' },
  { id:'test_coverage', content:'核心链路测试覆盖不足', holder:'qa', hidden:false, value:'high' },
  { id:'complaint_threshold', content:'用户对支付问题容忍度极低', holder:'ops', hidden:true, value:'medium' },
  { id:'delay_cost', content:'延期每天损失约20万元', holder:'ops', hidden:false, value:'high' },
  { id:'market_negotiable', content:'市场活动时间实际上可以协商', holder:'ceo', hidden:true, value:'critical' },
  { id:'competitor', content:'竞争对手下周将发布类似功能', holder:'ceo', hidden:true, value:'high' },
];

const roleResponses = {
  tech: [
    { keywords:['故障','概率','风险','接口','问题'], text:'核心支付接口的故障概率大约在15%左右。这个数字是基于最近一周的压力测试得出的。', fact:'failure_rate' },
    { keywords:['资源','人天','人力','可用','团队'], text:'目前研发团队还有3个人天的可用资源，再多就排不出来了。', fact:'available_dev' },
    { keywords:['灰度','范围','部分','有限','灰度发布'], text:'灰度发布到10%的用户在技术上没有障碍，我们可以做流量控制。', fact:'gray_feasible' },
    { keywords:['修复','多久','时间','人天','fix','改'], text:'修复这个缺陷大概需要3个人天，因为涉及到核心模块的重构。', fact:'fix_time' },
    { keywords:['支付','链路','影响','核心','业务','payment'], text:'这个接口确实直接影响支付链路。如果出问题，用户无法完成支付，影响面很大。', fact:'payment_chain' },
    { keywords:['回滚','rollback','撤销','恢复','回退'], text:'如果需要回滚，大概要4个小时。因为涉及到数据库迁移，不能简单回退。', fact:'rollback_time' },
  ],
  qa: [
    { keywords:['复现','重现','稳定'], text:'这个缺陷可以稳定复现，触发条件比较明确。', fact:'bug_reproducible' },
    { keywords:['严重','级别','p1','p2','priority','严重程度'], text:'缺陷严重程度是P1，属于必须修复的级别。', fact:'bug_severity' },
    { keywords:['测试','覆盖','情况','充分'], text:'目前核心链路的测试覆盖还不够充分，有几个场景没有覆盖到。', fact:'test_coverage' },
    { keywords:['上线','后果','投诉','用户反应','影响'], text:'如果上线后出问题，用户对支付失败会非常敏感，投诉会很快上来。', fact:'complaint_threshold' },
  ],
  ops: [
    { keywords:['延期','损失','钱','成本','万'], text:'延期上线每天大约损失20万，主要是市场活动的投入和用户预期。', fact:'delay_cost' },
    { keywords:['市场','活动','改','推迟','时间','调整'], text:'市场活动的时间……原则上不好改，但如果理由充分，也不是完全不行。这个你可能需要跟陈总确认。', fact:null, hint:'ceo_market' },
    { keywords:['用户','投诉','容忍','反应','支付问题'], text:'用户对支付问题的容忍度非常低。一旦支付失败，流失率会很高。', fact:'complaint_threshold' },
  ],
  ceo: [
    { keywords:['推迟','延期','改时间','协商','市场活动','时间能'], text:'其实市场活动的时间是可以协商的。如果有充分的技术风险理由，我可以去跟市场部门协调推迟两天。', fact:'market_negotiable' },
    { keywords:['竞争','对手','对手','市场','态势'], text:'竞争对手下周也要发布类似的功能，所以时间窗口确实比较紧。', fact:'competitor' },
    { keywords:['优先级','目标','最重要','战略'], text:'我们的首要目标是稳定上线，但不希望以重大事故为代价。平衡风险和速度是你的工作。', fact:null },
  ],
};

const genericResponses = {
  tech: '这块我建议你具体看看接口的故障概率和修复时间。你能接受多大的风险？',
  qa: '从质量角度看，我更关心缺陷的严重程度和复现情况。你了解过了吗？',
  ops: '我最关心的是延期损失和市场窗口。你需要了解具体的数字。',
  ceo: '你需要把技术风险和商业影响都搞清楚，然后给我一个有依据的建议。',
};

const suggestedQuestions = {
  tech: ['接口故障概率是多少？','还有多少研发资源？','灰度发布可行吗？','修复缺陷需要多久？','接口影响什么业务？','回滚需要多久？'],
  qa: ['缺陷能复现吗？','严重程度是什么级别？','测试覆盖怎么样？','上线后出问题会怎样？'],
  ops: ['延期损失多少？','市场活动能改时间吗？','用户对支付问题的反应？'],
  ceo: ['上线时间能推迟吗？','有竞争对手的消息吗？','市场活动的优先级？'],
};

const steps = [
  { num:1, label:'接收任务', desc:'阅读场景简报' },
  { num:2, label:'发现信息源', desc:'识别关键干系人' },
  { num:3, label:'访谈与验证', desc:'主动获取信息' },
  { num:4, label:'建立决策模型', desc:'整理约束与方案' },
  { num:5, label:'提交决策', desc:'选择方案并说明依据' },
  { num:6, label:'观察后果', desc:'查看项目状态变化' },
  { num:7, label:'证据化复盘', desc:'回顾决策过程' },
];

const constraints = [
  { id:'resource', label:'可用研发资源不超过3人天' },
  { id:'window', label:'上线窗口不晚于后日上午' },
  { id:'quality', label:'P1缺陷必须修复或规避' },
  { id:'rollback', label:'回滚时间须小于2小时（事故响应要求）' },
];

// ===== STATE =====
const state = {
  step: 1,
  timeRemaining: 40,
  interviewedRoles: [],
  currentRole: null,
  discoveredFacts: [],
  chatHistory: {},
  askedQuestions: {},
  decision: null,
  evidenceFacts: [],
  decisionRationale: '',
  contingencyPlan: '',
  consequences: null,
};

// ===== RENDER =====
function renderSteps() {
  const list = document.getElementById('stepList');
  list.innerHTML = steps.map(s => {
    const isActive = s.num === state.step;
    const isDone = s.num < state.step;
    return `<div class="step-item ${isActive?'active':''} ${isDone?'done':''}" onclick="goToStep(${s.num})">
      <div class="step-num">${isDone?'':`<span>${s.num}</span>`}</div>
      <div class="step-info"><div class="step-label">${s.label}</div><div class="step-desc">${s.desc}</div></div>
    </div>`;
  }).join('');
}

function renderContent() {
  const area = document.getElementById('contentArea');
  const infoPanel = document.getElementById('infoPanel');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const phaseLabel = document.getElementById('phaseLabel');
  const phaseTitle = document.getElementById('phaseTitle');

  const currentStep = steps[state.step-1];
  phaseLabel.textContent = `阶段 ${state.step}`;
  phaseTitle.textContent = currentStep.label;

  prevBtn.style.display = state.step > 1 && state.step < 7 ? 'inline-flex' : 'none';
  infoPanel.style.display = (state.step >= 3 && state.step <= 5) ? 'flex' : 'none';

  if (state.step === 1) renderBriefing(area, nextBtn);
  else if (state.step === 2) renderRoles(area, nextBtn);
  else if (state.step === 3) renderChat(area, nextBtn);
  else if (state.step === 4) renderDecisionModel(area, nextBtn);
  else if (state.step === 5) renderDecisionSubmit(area, nextBtn);
  else if (state.step === 6) renderConsequences(area, nextBtn);
  else if (state.step === 7) renderReview(area, nextBtn);

  renderSteps();
  updateTimer();
}

function renderBriefing(area, nextBtn) {
  nextBtn.textContent = '进入信息源';
  nextBtn.style.display = 'inline-flex';
  area.innerHTML = `
    <div class="briefing-hero">
      <div class="briefing-tag">紧急决策 · T-12h</div>
      <h1 class="briefing-title">上线前夜：Go / Delay / Limited Release</h1>
      <p class="briefing-subtitle">你需要在限定时间内完成信息收集、方案比较并提交最终决策，承担决策产生的动态后果。</p>
    </div>
    <div class="briefing-card">
      <h3>场景简报</h3>
      <div class="briefing-text">
        产品计划<strong>明日 09:00 上线</strong>，并配合已经承诺的市场推广活动。<br><br>
        但测试尚未完全结束，<strong>核心接口存在不确定风险</strong>，研发和测试资源有限。延期会造成商业损失，强行上线可能带来线上事故。<br><br>
        你需要在限定时间内提交以下方案之一，或提出满足规则的组合方案。
      </div>
      <div class="briefing-meta">
        <div class="meta-item"><span class="meta-label">截止时间</span><span class="meta-value">明日 09:00</span></div>
        <div class="meta-item"><span class="meta-label">时间预算</span><span class="meta-value">40 分钟</span></div>
        <div class="meta-item"><span class="meta-label">可用角色</span><span class="meta-value">4 位干系人</span></div>
      </div>
    </div>
    <div class="briefing-options">
      <div class="option-card"><div class="option-code">Option A</div><div class="option-name">Go</div><div class="option-desc">按计划全面上线，承担全部风险</div></div>
      <div class="option-card"><div class="option-code">Option B</div><div class="option-name">Delay</div><div class="option-desc">延迟上线，等待修复完成</div></div>
      <div class="option-card"><div class="option-code">Option C</div><div class="option-name">Limited Release</div><div class="option-desc">灰度发布，控制影响范围</div></div>
    </div>
  `;
}

function renderRoles(area, nextBtn) {
  const canProceed = state.interviewedRoles.length > 0 || true;
  nextBtn.textContent = '进入访谈';
  nextBtn.style.display = 'inline-flex';
  area.innerHTML = `
    <div class="briefing-hero">
      <h1 class="briefing-title" style="font-size:28px;">识别关键干系人</h1>
      <p class="briefing-subtitle">以下四位角色掌握不同信息和利益诉求。你无法访谈所有人——每次访谈消耗时间预算。选择你认为最关键的角色开始。</p>
    </div>
    <div class="roles-grid">
      ${roles.map(r => `
        <div class="role-card ${state.interviewedRoles.includes(r.id)?'interviewed':''}" onclick="startInterview('${r.id}')">
          <div class="role-avatar" style="background:${r.color}22;color:${r.color};border-radius:50%;">${r.initial}</div>
          <div class="role-name">${r.name}</div>
          <div class="role-title">${r.title}</div>
          <div class="role-desc">${r.desc}</div>
          <div class="role-interest"><strong>关注点：</strong> ${r.interest}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderChat(area, nextBtn) {
  if (!state.currentRole) {
    nextBtn.textContent = '完成访谈';
    nextBtn.style.display = 'inline-flex';
    area.innerHTML = `
      <div class="briefing-hero">
        <h1 class="briefing-title" style="font-size:28px;">访谈与信息验证</h1>
        <p class="briefing-subtitle">点击下方角色开始访谈。每次访谈消耗 5 分钟时间预算。你可以通过提问或点击建议问题来获取信息。</p>
      </div>
      <div class="roles-grid">
        ${roles.map(r => `
          <div class="role-card ${state.interviewedRoles.includes(r.id)?'interviewed':''}" onclick="startInterview('${r.id}')">
            <div class="role-avatar" style="background:${r.color}22;color:${r.color};border-radius:50%;">${r.initial}</div>
            <div class="role-name">${r.name}</div>
            <div class="role-title">${r.title}</div>
            <div class="role-desc">${r.desc}</div>
          </div>
        `).join('')}
      </div>
    `;
    return;
  }

  nextBtn.style.display = 'none';
  const role = roles.find(r => r.id === state.currentRole);
  const history = state.chatHistory[state.currentRole] || [];
  const asked = state.askedQuestions[state.currentRole] || [];

  area.innerHTML = `
    <div class="chat-container">
      <div class="chat-header">
        <div class="chat-back" onclick="exitInterview()">← 返回角色列表</div>
        <div class="chat-role-info">
          <div class="role-avatar" style="background:${role.color}22;color:${role.color};width:36px;height:36px;font-size:16px;border-radius:50%;">${role.initial}</div>
          <div><div class="role-name" style="font-size:16px;">${role.name}</div><div class="role-title" style="font-size:12px;">${role.title}</div></div>
        </div>
      </div>
      <div class="chat-messages" id="chatMessages">
        ${history.map(m => `<div class="msg ${m.type}">${m.text}${m.factNote ? `<div style="margin-top:8px;font-size:12px;color:var(--teal);">>> ${m.factNote}</div>`:''}</div>`).join('')}
      </div>
      <div class="suggested-questions" id="suggestedQuestions">
        ${suggestedQuestions[role.id].map((q, i) => `
          <div class="question-chip ${asked.includes(i)?'asked':''}" ${!asked.includes(i)?`onclick="askQuestion('${role.id}', ${i})"`:''}>${q}</div>
        `).join('')}
      </div>
      <div class="chat-input-area">
        <input type="text" class="chat-input" id="chatInput" placeholder="输入你的问题..." onkeypress="if(event.key==='Enter')sendMessage()">
        <button class="btn btn-primary" onclick="sendMessage()">发送</button>
      </div>
    </div>
  `;
  const chatMsgs = document.getElementById('chatMessages');
  chatMsgs.scrollTop = chatMsgs.scrollHeight;
}

function renderDecisionModel(area, nextBtn) {
  nextBtn.textContent = '进入决策提交';
  nextBtn.style.display = 'inline-flex';
  area.innerHTML = `
    <div class="briefing-hero">
      <h1 class="briefing-title" style="font-size:28px;">建立决策模型</h1>
      <p class="briefing-subtitle">将访谈中获得的信息整理为结构化决策依据。确认你掌握的事实、约束和方案比较。</p>
    </div>
    <div class="decision-block">
      <h3>已获取的关键信息 <span class="count">${state.discoveredFacts.length} 条</span></h3>
      ${state.discoveredFacts.length === 0 ? '<p style="color:var(--dim);font-size:13px;">尚未获取任何信息，请回到访谈阶段。</p>' :
        state.discoveredFacts.map(fid => {
          const f = facts.find(fa => fa.id === fid);
          const r = roles.find(ro => ro.id === f.holder);
          return `<div class="fact-item ${f.hidden?'hidden-fact':''}" style="margin-bottom:8px;">

// ===== LOGIC =====
function startInterview(roleId) {
  if (state.timeRemaining < 5) { alert('时间不足，无法继续访谈！'); return; }
  state.currentRole = roleId;
  if (!state.interviewedRoles.includes(roleId)) {
    state.interviewedRoles.push(roleId);
    state.timeRemaining -= 5;
  }
  if (!state.chatHistory[roleId]) {
    state.chatHistory[roleId] = [{ type:'role', text:`你好，我是${roles.find(r=>r.id===roleId).name}，${roles.find(r=>r.id===roleId).title}。有什么想了解的？` }];
  }
  if (!state.askedQuestions[roleId]) state.askedQuestions[roleId] = [];
  renderContent();
  renderInfoPanel();
}

function exitInterview() {
  state.currentRole = null;
  renderContent();
}

function askQuestion(roleId, qIndex) {
  const question = suggestedQuestions[roleId][qIndex];
  processMessage(roleId, question);
  state.askedQuestions[roleId].push(qIndex);
  renderContent();
}

function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  processMessage(state.currentRole, text);
  input.value = '';
  renderContent();
}

function processMessage(roleId, userText) {
  state.chatHistory[roleId].push({ type:'student', text:userText });
  const responses = roleResponses[roleId];
  const input = userText.toLowerCase();
  let matched = null;
  for (const resp of responses) {
    if (resp.keywords.some(kw => input.includes(kw.toLowerCase()))) { matched = resp; break; }
  }
  setTimeout(() => {
    const typingEl = document.createElement('div');
    typingEl.className = 'typing-indicator';
    typingEl.id = 'typingIndicator';
    typingEl.innerHTML = '<span></span><span></span><span></span>';
    document.getElementById('chatMessages').appendChild(typingEl);
    document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
    setTimeout(() => {
      const el = document.getElementById('typingIndicator');
      if (el) el.remove();
      if (matched) {
        state.chatHistory[roleId].push({ type:'role', text:matched.text });
        if (matched.fact && !state.discoveredFacts.includes(matched.fact)) {
          state.discoveredFacts.push(matched.fact);
          const f = facts.find(fa => fa.id === matched.fact);
          state.chatHistory[roleId].push({ type:'fact-discovered', text:f.content, factNote:`已记录到信息板` });
        }
      } else {
        state.chatHistory[roleId].push({ type:'role', text:genericResponses[roleId] });
      }
      renderContent();
    }, 800 + Math.random() * 600);
  }, 200);
}

function selectDecision(option) {
  state.decision = option;
  var choices = document.querySelectorAll('.option-choice');
  var opts = ['go', 'delay', 'limited'];
  choices.forEach(function(el, i) {
    el.classList.toggle('selected', opts[i] === option);
  });
  updateConstraintCheck();
  var errEl = document.getElementById('submitErrors');
  if (errEl) errEl.style.display = 'none';
}

function toggleEvidence(factId) {
  var idx = state.evidenceFacts.indexOf(factId);
  if (idx >= 0) state.evidenceFacts.splice(idx, 1);
  else state.evidenceFacts.push(factId);
  var el = document.querySelector('.fact-check[data-fact-id="' + factId + '"]');
  if (el) el.classList.toggle('checked', state.evidenceFacts.includes(factId));
  var countEls = document.querySelectorAll('.decision-block .count');
  if (countEls.length > 1) countEls[1].textContent = state.evidenceFacts.length + ' 条';
  var errEl = document.getElementById('submitErrors');
  if (errEl) errEl.style.display = 'none';
}

function updateConstraintCheck() {
  const el = document.getElementById('constraintResults');
  if (!el) return;
  if (!state.decision) {
    el.innerHTML = '<div class="constraint-result pending">等待方案选择...</div>';
    return;
  }
  const checks = computeConstraints(state.decision);
  el.innerHTML = checks.map(c =>
    `<div class="constraint-result ${c.passed?'pass':'fail'}">${c.passed?'✓':'✕'} ${c.label}</div>`
  ).join('');
}

function computeConstraints(decision) {
  const has = (fid) => state.discoveredFacts.includes(fid);
  if (decision === 'go') {
    return [
      { label:'研发资源：3人天可用 — 无需额外修复', passed:true },
      { label:'上线窗口：明日09:00 — 满足', passed:true },
      { label:'P1缺陷：未修复就上线 — 违反质量约束', passed:false },
      { label:`回滚要求：<2小时 — ${has('rollback_time')?'实际需4小时，违反约束':'未知回滚时间，存在风险'}`, passed:false },
    ];
  } else if (decision === 'delay') {
    return [
      { label:'研发资源：3人天可用 — 可完成修复', passed:true },
      { label:'上线窗口：将推迟 — 但市场窗口允许协商', passed:has('market_negotiable') },
      { label:'P1缺陷：有足够时间修复', passed:true },
      { label:'回滚要求：延迟上线无需即时回滚', passed:true },
    ];
  } else {
    return [
      { label:'研发资源：灰度范围10%，资源充足', passed:true },
      { label:'上线窗口：灰度发布在窗口内', passed:true },
      { label:'P1缺陷：灰度范围受限但仍需关注', passed:has('bug_severity') },
      { label:`回滚要求：${has('rollback_time')?'4小时 — 超出2小时要求，需注意':'回滚时间未知'}`, passed:has('rollback_time') ? false : false },

  }

        verdict:'部分成功 · 存在盲区', verdictType:'warning',
        title:'灰度发布完成，但风险认知不足',
        description:'灰度发布到10%用户，降低了风险暴露面。但你未充分了解支付链路影响和回滚能力，如果灰度期间触发故障，应急响应可能不足。',
        states:[
          { name:'项目进度', value:85, changeType:'flat', changeText:'灰度中', barColor:'amber', detail:'灰度发布10%' },
          { name:'质量风险', value:50, changeType:'down', changeText:'-10%', barColor:'amber', detail:'灰度降低风险，但P1缺陷未修复' },
          { name:'组织支持', value:60, changeType:'down', changeText:'-10%', barColor:'amber', detail:'方案尚可，但决策依据不够充分' },
        ],
        events:[
          { type:'success', text:'<strong>灰度发布完成</strong>：10%用户上线' },
          { type:'warning', text:'<strong>风险认知不足</strong>：未确认支付链路影响范围' },
          { type:'warning', text:'<strong>回滚能力未知</strong>：未确认回滚时间，应急存在盲区' },
          { type:'success', text:'<strong>未触发重大事故</strong>：灰度范围限制了影响' },
        ],
      };
    }
  }
}

function computeReview() {
  const c = state.consequences;
  const has = (fid) => state.discoveredFacts.includes(fid);
  const totalFacts = facts.length;
  const hiddenFacts = facts.filter(f => f.hidden);
  const foundHidden = hiddenFacts.filter(f => has(f.id));
  const missedHidden = hiddenFacts.filter(f => !has(f.id));

  let score = 0;
  score += state.interviewedRoles.length * 5;
  score += state.discoveredFacts.length * 4;
  score += foundHidden.length * 8;
  score += state.evidenceFacts.length * 3;
  if (state.decisionRationale.length > 50) score += 5;
  if (state.contingencyPlan.length > 50) score += 5;
  if (c.verdictType === 'success') score += 20;
  else if (c.verdictType === 'warning') score += 10;

  const grade = score >= 80 ? '优秀' : score >= 60 ? '良好' : score >= 40 ? '合格' : '需改进';

  const evidenceUsed = state.evidenceFacts.map(fid => {
    const f = facts.find(fa => fa.id === fid);
    const r = roles.find(ro => ro.id === f.holder);
    return { fact: f.content, source: `${r.name}（${r.title}）` };
  });

  const missedFacts = missedHidden.map(f => {
    const r = roles.find(ro => ro.id === f.holder);
    const impacts = {
      fix_time: '未了解修复时间，无法判断资源是否充足',
      payment_chain: '未识别支付链路影响，风险判断不完整',
      rollback_time: '未确认回滚时间，应急预案存在盲区',
      complaint_threshold: '未了解用户容忍度，可能低估影响',
      market_negotiable: '未发现市场活动可协商，错失延迟方案的空间',
      competitor: '未了解竞争态势，决策缺少市场维度信息',
    };
    return { fact: f.content, impact: impacts[f.id] || '该信息可能影响决策判断' };
  });

  const consequenceExplanation = c.events.map(e => e.text.replace(/<[^>]*>/g, ''));

  const suggestions = [];
  if (!has('payment_chain')) suggestions.push({ title:'下次先确认核心接口的业务影响范围', detail:'支付链路是核心业务，如果接口故障影响支付，风险等级需要上调。' });
  if (!has('rollback_time')) suggestions.push({ title:'提交方案前必须确认回滚能力', detail:'回滚时间是应急预案的关键指标，不了解就无法制定有效的应急方案。' });
  if (!has('market_negotiable')) suggestions.push({ title:'不要假设硬约束不可协商', detail:'市场活动时间实际上可以协商，主动询问CEO可能打开新的方案空间。' });
  if (state.evidenceFacts.length < 3) suggestions.push({ title:'决策应引用更多证据', detail:'重大决策应基于至少3条以上经过验证的信息，避免凭直觉判断。' });
  if (state.interviewedRoles.length < 3) suggestions.push({ title:'访谈更多角色以获取多元视角', detail:'不同角色代表不同利益和信息，访谈不足会导致信息盲区。' });
  if (suggestions.length === 0) suggestions.push({ title:'决策过程完整，继续保持', detail:'你很好地完成了信息收集、验证和方案比较，决策有充分依据。' });

  const counterfactual = [];
  if (state.decision !== 'go') {
    counterfactual.push({ option:'如果选择 Go（全面上线）', result: has('payment_chain') ? '<strong>大概率触发支付故障</strong>，15%故障率在全面用户范围内影响严重' : '<strong>可能触发重大事故</strong>，支付链路故障导致用户投诉和流失' });
  }
  if (state.decision !== 'delay') {
    counterfactual.push({ option:'如果选择 Delay（延迟上线）', result: has('market_negotiable') ? '<strong>可避免全部技术风险</strong>，延期2天损失40万但质量有保障' : '<strong>技术风险消除</strong>，但运营部门可能对延迟有意见' });
  }
  if (state.decision !== 'limited') {
    counterfactual.push({ option:'如果选择 Limited Release（灰度发布）', result: has('rollback_time') ? '<strong>最优平衡方案</strong>，灰度10%控制风险，逐步扩大' : '<strong>风险降低但回滚能力未知</strong>，灰度期间出问题可能无法及时回滚' });
  }

  return { score: Math.min(score, 100), grade, evidenceUsed, missedFacts, consequenceExplanation, suggestions, counterfactual };
}

function submitDecision() {
  var errors = [];
  if (!state.decision) errors.push('请选择一个方案（Go / Delay / Limited Release）');
  if (state.evidenceFacts.length === 0) errors.push('请至少引用一条证据');
  if (state.decisionRationale.trim().length < 10) errors.push('请填写决策依据（至少10个字）');
  if (state.contingencyPlan.trim().length < 10) errors.push('请填写应急预案（至少10个字）');
  if (errors.length > 0) {
    var errEl = document.getElementById('submitErrors');
    if (errEl) {
      errEl.innerHTML = errors.map(function(e) {
        return '<div style="color:var(--coral);font-size:13px;padding:6px 0;border-bottom:1px solid var(--border);">⚠ ' + e + '</div>';
      }).join('');
      errEl.style.display = 'block';
      errEl.scrollIntoView({ behavior:'smooth' });
    }
    return false;
  }
  state.consequences = computeConsequences();
  state.consequences.review = computeReview();
  return true;
}

function nextStep() {
  if (state.step === 5) {
    if (!submitDecision()) return;
  }
  if (state.step < 7) {
    state.step++;
    state.currentRole = null;
    renderContent();
  }
}

function prevStep() {
  if (state.step > 1 && state.step < 7) {
    state.step--;
    state.currentRole = null;
    renderContent();
  }
}

function goToStep(num) {
  if (num <= state.step || (num === 3 && state.step >= 3)) {
    state.step = num;
    state.currentRole = null;
    renderContent();
  }
}

function updateTimer() {
  const min = Math.floor(state.timeRemaining);
  const display = `${min}:00`;
  document.getElementById('timerValue').textContent = display;
  document.getElementById('timerBar').style.width = `${(state.timeRemaining / 40) * 100}%`;
  if (state.timeRemaining <= 10) {
    document.getElementById('timerValue').style.color = 'var(--coral)';
  }
}

function renderInfoPanel() {
  const factList = document.getElementById('factList');
  document.getElementById('factCount').textContent = state.discoveredFacts.length;
  document.getElementById('roleCount').textContent = state.interviewedRoles.length;
  if (state.discoveredFacts.length === 0) {
    factList.innerHTML = '<div class="fact-list-empty">开始访谈后<br>关键信息将出现在这里</div>';
  } else {
    factList.innerHTML = state.discoveredFacts.map(fid => {
      const f = facts.find(fa => fa.id === fid);
      const r = roles.find(ro => ro.id === f.holder);
      return `<div class="fact-item ${f.hidden?'hidden-fact':''}">
        <div class="fact-source">${r.name}</div>
        <div class="fact-content">${f.content}</div>
        <span class="fact-tag ${f.value}">${f.value==='critical'?'关键':f.value==='high'?'高价值':f.value==='medium'?'中等':''}</span>
        ${f.hidden?'<span class="fact-tag hidden">隐藏</span>':''}
      </div>`;
    }).join('');
  }
}

// Initialize
renderContent();
renderInfoPanel();
</script>
</body>
</html>
